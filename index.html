<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NorthStar Care Navigation & Consulting</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #0f2d6b;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1rem;
      font-weight: 500;
    }

    .hero {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem 1.5rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.2rem;
      color: var(--primary);
      line-height: 1.25;
      margin-bottom: 1.25rem;
      font-weight: 800;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    @media (min-width: 640px) {
      .hero h1 {
        font-size: 3rem;
      }
      .cta-group {
        flex-direction: row;
        max-width: none;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">✦ NORTHSTAR CARE</a>
    <nav>
      <a href="#services">Services</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Guiding Families Through Care Transitions</h1>
    <p>Leaving a hospital or rehab facility is overwhelming. You don't have to figure out medications, schedules, and care alone.</p>
    <div class="cta-group">
      <a href="#begin" class="btn btn-primary">Begin Your Care Journey</a>
      <a href="#schedule" class="btn btn-secondary">Schedule Consultation</a>
    </div>
  </section>

</body>
</html>
